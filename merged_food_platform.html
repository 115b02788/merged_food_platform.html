        // --- FILM GRAIN GENERATOR ---
        function initGrain() {
            const canvas = document.getElementById(&#x27;grain-canvas&#x27;);
            const ctx = canvas.getContext(&#x27;2d&#x27;);
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener(&#x27;resize&#x27;, () =&gt; {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function loop() {
                const imageData = ctx.createImageData(width, height);
                const data = imageData.data;
                for (let i = 0; i &lt; data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = noise;
                    data[i+1] = noise;
                    data[i+2] = noise;
                    data[i+3] = 25; // low opacity
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(loop);
            }
            loop();
        }

        // --- WEB AUDIO API SOUND SYNTH (Projector Ambient Effect) ---
        let audioCtx = null;
        let projectorNoise = null;
        let isAudioPlaying = false;

        function toggleAudio() {
            const btnText = document.getElementById(&#x27;audio-text&#x27;);
            const btnIcon = document.getElementById(&#x27;audio-icon&#x27;);

            if (!isAudioPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // Create soft noise buffer for old film projector humming sound
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i &lt; bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.015; // Low volume noise
                }

                projectorNoise = audioCtx.createBufferSource();
                projectorNoise.buffer = buffer;
                projectorNoise.loop = true;

                // Lowpass Filter for warm ambient sound
                const filter = audioCtx.createBiquadFilter();
                filter.type = &#x27;lowpass&#x27;;
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);

                projectorNoise.connect(filter);
                filter.connect(audioCtx.destination);
                projectorNoise.start();

                isAudioPlaying = true;
                btnText.textContent = &quot;放映聲效: 播放中&quot;;
                btnIcon.className = &quot;fas fa-volume-high text-cinematic-gold&quot;;
            } else {
                if (projectorNoise) {
                    projectorNoise.stop();
                }
                isAudioPlaying = false;
                btnText.textContent = &quot;放映聲效: 關閉&quot;;
                btnIcon.className = &quot;fas fa-volume-xmark text-cinematic-gold&quot;;
            }
        }

        document.getElementById(&#x27;audio-control&#x27;).addEventListener(&#x27;click&#x27;, toggleAudio);


        // --- OPENING INTRO ANIMATION TIMELINE ---
        const creditsData = [
            { role: &quot;執導大師 (DIRECTED BY)&quot;, name: &quot;Chef Antoine Laurent &amp; Master Kenji&quot; },
            { role: &quot;領銜主演 (STARRING)&quot;, name: &quot;法式精緻醬汁 • 日式精密刀工 • 歐式天然發酵&quot; },
            { role: &quot;攝影指導 (CINEMATOGRAPHY)&quot;, name: &quot;極致 4K 影音畫質 • 味覺與視覺交響曲&quot; }
        ];

        let currentStage = 1;
        let introTimer = null;

        function runIntroSequence() {
            const stage1 = document.getElementById(&#x27;intro-stage-1&#x27;);
            const stage2 = document.getElementById(&#x27;intro-stage-2&#x27;);
            const stage3 = document.getElementById(&#x27;intro-stage-3&#x27;);
            const creditContent = document.getElementById(&#x27;credit-content&#x27;);

            // Stage 1 Fade In
            setTimeout(() =&gt; {
                stage1.classList.remove(&#x27;opacity-0&#x27;);
            }, 300);

            // Stage 1 Fade Out -&gt; Stage 2 Fade In (Title Reveal)
            setTimeout(() =&gt; {
                stage1.classList.add(&#x27;opacity-0&#x27;);
                setTimeout(() =&gt; {
                    stage1.classList.add(&#x27;hidden&#x27;);
                    stage2.classList.remove(&#x27;hidden&#x27;);
                    setTimeout(() =&gt; {
                        stage2.classList.remove(&#x27;opacity-0&#x27;, &#x27;scale-95&#x27;);
                        stage2.classList.add(&#x27;scale-100&#x27;);
                    }, 100);
                }, 1000);
            }, 3000);

            // Stage 2 Fade Out -&gt; Stage 3 (Rolling Credits)
            setTimeout(() =&gt; {
                stage2.classList.add(&#x27;opacity-0&#x27;);
                setTimeout(() =&gt; {
                    stage2.classList.add(&#x27;hidden&#x27;);
                    stage3.classList.remove(&#x27;hidden&#x27;);
                    stage3.classList.remove(&#x27;opacity-0&#x27;);

                    // Render Credits sequentially
                    creditsData.forEach((credit, idx) =&gt; {
                        setTimeout(() =&gt; {
                            const div = document.createElement(&#x27;div&#x27;);
                            div.className = &quot;transition-all duration-700 transform translate-y-4 opacity-0&quot;;
                            div.innerHTML = `
                                &lt;p class=&quot;text-xs text-cinematic-gold uppercase tracking-[0.4em] font-cinematic&quot;&gt;${credit.role}&lt;/p&gt;
                                &lt;p class=&quot;text-lg md:text-xl text-cinematic-cream font-serif mt-1 font-semibold&quot;&gt;${credit.name}&lt;/p&gt;
                            `;
                            creditContent.appendChild(div);
                            setTimeout(() =&gt; {
                                div.classList.remove(&#x27;translate-y-4&#x27;, &#x27;opacity-0&#x27;);
                            }, 50);
                        }, idx * 1800);
                    });
                }, 1000);
            }, 7000);

            // Finish Intro Automatically
            setTimeout(() =&gt; {
                skipIntro();
            }, 14500);
        }

        function skipIntro() {
            clearTimeout(introTimer);
            const introSeq = document.getElementById(&#x27;intro-sequence&#x27;);
            const mainContent = document.getElementById(&#x27;main-content&#x27;);
            const skipBtn = document.getElementById(&#x27;skip-intro-btn&#x27;);

            document.body.classList.add(&#x27;intro-hide&#x27;);
            introSeq.classList.add(&#x27;opacity-0&#x27;);
            skipBtn.classList.add(&#x27;opacity-0&#x27;, &#x27;pointer-events-none&#x27;);

            setTimeout(() =&gt; {
                introSeq.classList.add(&#x27;hidden&#x27;);
                mainContent.classList.remove(&#x27;opacity-0&#x27;, &#x27;pointer-events-none&#x27;);
            }, 1000);
        }


        // --- COURSE CARDS RENDERING &amp; FILTERING ---
        function renderCourses(items) {
            const container = document.getElementById(&#x27;course-grid&#x27;);
            container.innerHTML = &#x27;&#x27;;

            if (items.length === 0) {
                container.innerHTML = `
                    &lt;div class=&quot;col-span-full text-center py-16 text-cinematic-cream/50 font-serif&quot;&gt;
                        &lt;i class=&quot;fas fa-film text-4xl text-cinematic-gold/40 mb-3&quot;&gt;&lt;/i&gt;
                        &lt;p&gt;未找到符合條件的大師課程劇集&lt;/p&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            items.forEach(course =&gt; {
                const card = document.createElement(&#x27;div&#x27;);
                card.className = &quot;group relative bg-cinematic-deep border border-cinematic-gold/20 rounded-xl overflow-hidden hover:border-cinematic-gold transition-all duration-500 flex flex-col justify-between hover:shadow-2xl hover:shadow-cinematic-gold/10&quot;;
                
                card.innerHTML = `
                    &lt;div class=&quot;relative aspect-video overflow-hidden&quot;&gt;
                        &lt;img src=&quot;${course.image}&quot; alt=&quot;${course.title}&quot; class=&quot;w-full h-full object-cover group-hover:scale-110 transition-transform duration-700&quot;&gt;
                        &lt;div class=&quot;absolute inset-0 bg-gradient-to-t from-cinematic-deep via-transparent to-black/40&quot;&gt;&lt;/div&gt;
                        &lt;span class=&quot;absolute top-3 left-3 bg-cinematic-burgundy/90 text-cinematic-gold text-[10px] font-cinematic uppercase tracking-widest px-3 py-1 rounded-full border border-cinematic-gold/30&quot;&gt;
                            ${course.badge}
                        &lt;/span&gt;
                        &lt;button onclick=&quot;openTrailerModal(${course.id})&quot; class=&quot;absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 backdrop-blur-xs&quot;&gt;
                            &lt;div class=&quot;w-14 h-14 rounded-full bg-cinematic-gold text-black flex items-center justify-center text-lg shadow-xl transform group-hover:scale-110 transition-transform&quot;&gt;
                                &lt;i class=&quot;fas fa-play ml-1&quot;&gt;&lt;/i&gt;
                            &lt;/div&gt;
                        &lt;/button&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;p-6 flex-1 flex flex-col justify-between&quot;&gt;
                        &lt;div&gt;
                            &lt;div class=&quot;flex items-center justify-between text-xs text-cinematic-gold/80 font-cinematic mb-2&quot;&gt;
                                &lt;span&gt;&lt;i class=&quot;fas fa-user-ninja mr-1&quot;&gt;&lt;/i&gt;${course.director}&lt;/span&gt;
                                &lt;span&gt;&lt;i class=&quot;fas fa-star text-cinematic-gold mr-1&quot;&gt;&lt;/i&gt;${course.rating}&lt;/span&gt;
                            &lt;/div&gt;
                            &lt;h3 class=&quot;text-xl font-bold font-serif text-cinematic-cream group-hover:text-cinematic-gold transition-colors&quot;&gt;
                                ${course.title}
                            &lt;/h3&gt;
                            &lt;p class=&quot;text-xs font-cinematic text-cinematic-cream/40 uppercase tracking-wider mt-1 mb-3&quot;&gt;
                                ${course.englishTitle}
                            &lt;/p&gt;
                            &lt;p class=&quot;text-xs text-cinematic-cream/70 font-serif line-clamp-2 mb-4 leading-relaxed&quot;&gt;
                                ${course.desc}
                            &lt;/p&gt;
                        &lt;/div&gt;

                        &lt;div class=&quot;pt-4 border-t border-cinematic-gold/10 flex items-center justify-between text-xs text-cinematic-cream/50 font-serif&quot;&gt;
                            &lt;span&gt;&lt;i class=&quot;far fa-clock mr-1&quot;&gt;&lt;/i&gt;${course.duration}&lt;/span&gt;
                            &lt;button onclick=&quot;openTrailerModal(${course.id})&quot; class=&quot;text-cinematic-gold hover:underline flex items-center space-x-1&quot;&gt;
                                &lt;span&gt;觀賞試映&lt;/span&gt;
                                &lt;i class=&quot;fas fa-chevron-right text-[10px]&quot;&gt;&lt;/i&gt;
                            &lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
                container.appendChild(card);
            });
        }

        // Filter Logic
        function filterCourses() {
            const query = document.getElementById(&#x27;search-input&#x27;).value.toLowerCase();
            const cuisine = document.getElementById(&#x27;cuisine-filter&#x27;).value;
            const level = document.getElementById(&#x27;level-filter&#x27;).value;

            const filtered = courses.filter(item =&gt; {
                const matchesSearch = item.title.toLowerCase().includes(query) || 
                                      item.director.toLowerCase().includes(query) || 
                                      item.desc.toLowerCase().includes(query);
                const matchesCuisine = cuisine === &#x27;all&#x27; || item.cuisine === cuisine;
                const matchesLevel = level === &#x27;all&#x27; || item.level === level;

                return matchesSearch &amp;&amp; matchesCuisine &amp;&amp; matchesLevel;
            });

            renderCourses(filtered);
        }

        document.getElementById(&#x27;search-input&#x27;).addEventListener(&#x27;input&#x27;, filterCourses);
        document.getElementById(&#x27;cuisine-filter&#x27;).addEventListener(&#x27;change&#x27;, filterCourses);
        document.getElementById(&#x27;level-filter&#x27;).addEventListener(&#x27;change&#x27;, filterCourses);


        // --- TRAILER MODAL LOGIC ---
        function openTrailerModal(courseId) {
            const modal = document.getElementById(&#x27;trailer-modal&#x27;);
            const title = document.getElementById(&#x27;modal-title&#x27;);
            const subtitle = document.getElementById(&#x27;modal-subtitle&#x27;);
            const instructor = document.getElementById(&#x27;modal-instructor&#x27;);
            const poster = document.getElementById(&#x27;modal-poster&#x27;);

            if (courseId === &#x27;hero&#x27;) {
                title.textContent = &quot;TASTE &amp; CRAFT 品牌年度預告片 (Official Teaser)&quot;;
                subtitle.textContent = &quot;探索極致美食烹飪的電影級大師課&quot;;
                instructor.textContent = &quot;PRODUCED BY CULINARY EPIC STUDIO&quot;;
                poster.src = &quot;https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&amp;fit=crop&amp;w=1200&amp;q=80&quot;;
            } else {
                const course = courses.find(c =&gt; c.id === courseId);
                if (course) {
                    title.textContent = `${course.title} • 獨家試映`;
                    subtitle.textContent = course.englishTitle;
                    instructor.textContent = `DIRECTOR: ${course.director.toUpperCase()}`;
                    poster.src = course.image;
                }
            }

            modal.classList.remove(&#x27;opacity-0&#x27;, &#x27;pointer-events-none&#x27;);
        }

        function closeTrailerModal() {
            const modal = document.getElementById(&#x27;trailer-modal&#x27;);
            modal.classList.add(&#x27;opacity-0&#x27;, &#x27;pointer-events-none&#x27;);
        }

        function playMockVideo() {
            const desc = document.getElementById(&#x27;modal-desc&#x27;);
            desc.innerHTML = `&lt;span class=&quot;text-cinematic-gold animate-pulse&quot;&gt;&lt;i class=&quot;fas fa-spinner fa-spin mr-2&quot;&gt;&lt;/i&gt;正在從劇院級伺服器串流 4K HDR 視訊檔...&lt;/span&gt;`;
            setTimeout(() =&gt; {
                desc.textContent = &quot;預覽片段播放中 — 體會頂級食材在熾熱鐵板上的美妙聲響與細緻紋理。&quot;;
            }, 1500);
        }


        // --- INITIALIZATION ---
        window.onload = function() {
            initGrain();
            runIntroSequence();
            renderCourses(courses);
        };
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</section>
<script>
document.querySelectorAll('.tabs button').forEach(button=>{
 button.addEventListener('click',()=>{
   document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===button));
   document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id===button.dataset.target));
 });
});
</script>
